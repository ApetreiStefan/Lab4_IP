name: Keep Render Alive

on:
  schedule:
    - cron: "*/10 * * * *"   # la fiecare 10 minute
  workflow_dispatch:          # permite rulare manuală din UI

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 90 \
            -o /dev/null \
            -w "HTTP %{http_code} in %{time_total}s\n" \
            ${{ secrets.RENDER_URL }}/healthz